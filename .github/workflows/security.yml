name: Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-secrets-migrations:
    name: Policy, secrets, and migration invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce security invariants
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/security-gate.mjs --base="origin/${{ github.base_ref }}"
          else
            node scripts/security-gate.mjs
          fi

  dependency-audit:
    name: Production dependency audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Resolve lockfile security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload resolved lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          retention-days: 1
      - name: Audit production lockfile dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          git diff --exit-code -- package-lock.json

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
