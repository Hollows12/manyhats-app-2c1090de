name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint changed TypeScript/TSX files
        run: |
          # Determine which TS/TSX files changed vs the base.
          # For pull_request events: compare against the base branch.
          # For push events: compare against the previous commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' 2>/dev/null | tr '\n' ' ')
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.ts' '*.tsx' 2>/dev/null | tr '\n' ' ')
          fi
          if [ -z "$CHANGED" ]; then
            echo "No TypeScript/TSX files changed — skipping lint"
            exit 0
          fi
          echo "Linting changed files: $CHANGED"
          # Exits 1 on any error (e.g. Prettier violations, broken rules).
          # Exits 0 when only warnings remain (e.g. pre-existing any casts).
          npx eslint $CHANGED

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # When unset (e.g. PRs from forks) the E2E suite skips itself.
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'placeholder' }}

  backend:
    name: Backend (Supabase migrations + edge functions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin for reproducible CI and to avoid the action's rate-limited
          # "latest release" lookup.
          version: 2.111.0

      - name: Validate supabase/config.toml
        run: |
          if [ -f supabase/config.toml ]; then
            echo "Found supabase/config.toml"
          else
            echo "No supabase/config.toml — skipping"
            exit 0
          fi

      - name: Lint SQL migrations
        run: |
          if [ -d supabase/migrations ]; then
            for f in supabase/migrations/*.sql; do
              [ -e "$f" ] || continue
              echo "Checking $f"
              # Basic sanity: file is non-empty and parses as text
              test -s "$f" || { echo "Empty migration: $f"; exit 1; }
            done
          fi

      - name: Setup Deno (for edge functions)
        if: hashFiles('supabase/functions/**/*.ts') != ''
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Typecheck edge functions
        if: hashFiles('supabase/functions/**/*.ts') != ''
        run: |
          for dir in supabase/functions/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            if [ -f "${dir}index.ts" ]; then
              echo "Typechecking $dir"
              deno check "${dir}index.ts"
            fi
          done
