name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'placeholder' }}

  backend:
    name: Backend (Supabase lint + edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate supabase/config.toml
        run: |
          if [ -f supabase/config.toml ]; then
            echo "Found supabase/config.toml"
          else
            echo "No supabase/config.toml — skipping"
            exit 0
          fi

      - name: Supabase DB lint
        run: |
          if [ -f supabase/config.toml ]; then
            supabase db lint
          fi

      - name: Setup Deno (for edge functions)
        if: hashFiles('supabase/functions/**/*.ts') != ''
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Typecheck edge functions
        if: hashFiles('supabase/functions/**/*.ts') != ''
        run: |
          for dir in supabase/functions/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            if [ -f "${dir}index.ts" ]; then
              echo "Typechecking $dir"
              deno check "${dir}index.ts"
            fi
          done
